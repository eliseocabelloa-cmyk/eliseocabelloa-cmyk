<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="line" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="840" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset="1" stop-color="#0a1330"/></linearGradient>
</defs>
<style>
text{font-family:'Fira Code',ui-monospace,monospace}
.n{font-size:40px;font-weight:700;fill:#fff}
.l{font-size:11px;letter-spacing:3px;fill:#60a5fa}
.pill{font-size:11px;font-weight:700;fill:#e2e8f0}
.dot{animation:run 4s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(780px)}}
.bar{stroke-dasharray:780;stroke-dashoffset:780;animation:draw 2.5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.p{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
</style>
<rect x="2" y="2" width="896" height="296" rx="26" fill="url(#bg)" stroke="#1e3a5f" stroke-width="2"/>
<line class="bar" x1="60" y1="46" x2="840" y2="46" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
<circle class="dot" cx="60" cy="46" r="5" fill="#34d399"/>
<text x="60" y="88" class="l" fill="#38bdf8" style="fill:#38bdf8;font-weight:700">PUBLIC GITHUB SNAPSHOT</text>
<text x="840" y="88" class="l" text-anchor="end" style="font-size:10px">OCT 2026</text>
<!-- EDITA: cambia cada — por tu número (estrellas, repositorios, forks, seguidores) -->
<g text-anchor="middle">
<text x="140" y="150" class="n">—</text><text x="140" y="178" class="l">STARS</text>
<text x="350" y="150" class="n">—</text><text x="350" y="178" class="l">REPOSITORIES</text>
<text x="560" y="150" class="n">—</text><text x="560" y="178" class="l">FORKS</text>
<text x="770" y="150" class="n">—</text><text x="770" y="178" class="l">FOLLOWERS</text>
</g>
<text x="60" y="251" class="l" style="font-size:10px">CORE LANGUAGES</text>
<g class="pill" text-anchor="middle">
<rect class="p" x="200" y="230" width="120" height="30" rx="15" fill="#0c2a3d" stroke="#38bdf8"/><text x="260" y="249">TypeScript</text>
<rect class="p" x="334" y="230" width="100" height="30" rx="15" fill="#1a1838" stroke="#8b5cf6" style="animation-delay:.5s"/><text x="384" y="249">Python</text>
<rect class="p" x="448" y="230" width="80" height="30" rx="15" fill="#0c2e26" stroke="#34d399" style="animation-delay:1s"/><text x="488" y="249">C++</text>
<rect class="p" x="542" y="230" width="80" height="30" rx="15" fill="#1c2233" stroke="#64748b" style="animation-delay:1.5s"/><text x="582" y="249">SQL</text>
<rect class="p" x="636" y="230" width="90" height="30" rx="15" fill="#0c2a3d" stroke="#38bdf8" style="animation-delay:2s"/><text x="681" y="249">HTML</text>
</g>
</svg>
